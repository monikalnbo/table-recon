name: Build Desktop App

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/build-desktop.yml"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            artifact: "desktop/dist/*.exe"
          # Linux 交叉打 Mac zip：不占稀缺 macos runner，几分钟就能出包
          - os: ubuntu-latest
            args: --linux AppImage --mac zip --x64 --arm64
            artifact: |
              desktop/dist/*.AppImage
              desktop/dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install & Package (electron-builder)
        working-directory: desktop
        run: |
          npm install
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # 免签名；Linux 交叉打 Mac zip 必须关

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TableRecon-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
