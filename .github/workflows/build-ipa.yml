name: Build iOS App

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/**"]
  workflow_dispatch: {}

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned .ipa (Release, generic iOS device)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild \
            -project TableRecon.xcodeproj \
            -scheme TableRecon \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            clean build

          APP="$(find build/DD/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1)"
          cd "$(dirname "$APP")"
          mkdir -p Payload
          cp -r "$(basename "$APP")" Payload/
          zip -qry ../TableRecon.ipa Payload
          mv ../TableRecon.ipa "$GITHUB_WORKSPACE/ios/build/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TableRecon-ipa
          path: ios/build/TableRecon.ipa
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/TableRecon.ipa
